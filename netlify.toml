# Netlify configuration for thefractionalexec.com.au
# Configured to allow all crawlers and bots

[build]
  publish = "."
  functions = "netlify/functions"

# Install dependencies for Netlify Functions
[[plugins]]
  package = "@netlify/plugin-functions-install-core"

# Redirect www to non-www (canonical URL)
[[redirects]]
  from = "https://www.thefractionalexec.com.au/*"
  to = "https://thefractionalexec.com.au/:splat"
  status = 301
  force = true

# Headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking but allow crawlers
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Headers for static assets - longer cache
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# robots.txt - ensure it's accessible
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# IMPORTANT: Disable Netlify's bot protection
# This must also be configured in Netlify dashboard:
# Site settings > Domain management > Bot protection > Disable
# Or Site settings > Build & deploy > Post processing > Disable prerendering


